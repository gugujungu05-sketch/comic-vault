<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>漫画库 ComicVault</title>
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="manifest" id="cv-manifest" href="./manifest.webmanifest" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #242044 0%, #0e1015 62%);
      color: #e9edf6; text-align: center; padding: 24px;
    }
    .card {
      max-width: 560px; width: 100%;
      background: #171c26; border: 1px solid #272e3d; border-radius: 16px;
      padding: 34px 28px;
    }
    .logo {
      width: 56px; height: 56px; border-radius: 15px; margin: 0 auto 14px;
      display: grid; place-items: center; background: #7c6cff; color: #fff; font-size: 30px;
    }
    h1 { font-size: 22px; margin: 0 0 10px; }
    .status { font-size: 14px; color: #97a1b6; line-height: 1.9; margin-bottom: 20px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #ffb14d; }
    .dot.ok { background: #35d0a5; }
    .hint { font-size: 13px; color: #97a1b6; line-height: 2; text-align: left; background: #12161f; border: 1px solid #2b3342; border-radius: 12px; padding: 14px 18px; margin-bottom: 22px; }
    .hint b { color: #cfd6e6; }
    .btn {
      display: inline-block; text-decoration: none; cursor: pointer;
      background: #7c6cff; color: #fff; border: 0; border-radius: 10px;
      padding: 11px 22px; font-size: 14px; font-weight: 700; margin: 4px;
    }
    .btn.ghost { background: transparent; border: 1px solid #3a4256; color: #cfd6e6; font-weight: 500; }
    code { background: #12161f; border: 1px solid #2b3342; border-radius: 5px; padding: 1px 6px; font-size: 12.5px; color: #c9d3e8; }
    a { color: #a99cff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📚</div>
    <h1>漫画库 ComicVault</h1>
    <div class="status" id="status"><span class="dot"></span>正在检查本机服务…</div>
    <div class="hint" id="hint" hidden>
      网站应用已就绪，数据保存在<b>你电脑上的漫画库软件</b>里。<br />
      打开桌面软件（任务栏右下角有图标）后，刷新本页即可登录使用，<br />
      手机连同一 Wi-Fi 打开本页也一样能用。
    </div>
    <div id="actions" hidden>
      <button class="btn" onclick="location.reload()">我已打开软件 · 重新连接</button>
      <a class="btn ghost" href="https://github.com/gugujungu05-sketch/comic-vault/releases/latest" target="_blank" rel="noreferrer">下载桌面软件</a>
    </div>
  </div>
  <script>
    (function () {
      // 尝试连接本机运行的漫画库服务（桌面软件内置，127.0.0.1:8787）
      var tried = false;
      function probe(port) {
        return fetch('http://127.0.0.1:' + port + '/api/runtime', { mode: 'cors', cache: 'no-store' })
          .then(function (r) { return r.ok; })
          .catch(function () { return false; });
      }
      function ok() {
        document.getElementById('status').innerHTML =
          '<span class="dot ok"></span>已连接本机漫画库服务';
        document.getElementById('hint').hidden = true;
        var a = document.getElementById('actions');
        a.hidden = false;
        a.innerHTML = '<a class="btn" href="http://127.0.0.1:8787/">进入我的漫画库</a>';
      }
      function notYet() {
        if (tried) return; tried = true;
        document.getElementById('status').innerHTML =
          '<span class="dot"></span>本机服务未运行';
        document.getElementById('hint').hidden = false;
        document.getElementById('actions').hidden = false;
      }
      // http 页面访问 https 资源之外的混合限制：本页是 https，探测 http://127.0.0.1 会被浏览器拦，
      // 所以同时给出手动入口，探测成功只是锦上添花。
      probe(8787).then(function (good) { if (good) ok(); else setTimeout(notYet, 1200); });
      setTimeout(notYet, 3500);
    })();
  </script>
</body>
</html>
